name: Integration

on:
  push:
  pull_request:

jobs:
  discover-formulas:
    name: Discover formulas
    runs-on: ubuntu-latest
    outputs:
      formulas: ${{ steps.list.outputs.formulas }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List formulas
        id: list
        run: |
          formulas=$(ls Formula/*.rb | xargs -n1 basename | sed 's/\.rb$//' | jq -R . | jq -sc .)
          echo "formulas=$formulas" >> "$GITHUB_OUTPUT"

  test-formula:
    name: Test ${{ matrix.formula }}
    needs: discover-formulas
    runs-on: macos-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJson(needs.discover-formulas.outputs.formulas) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test formula
        uses: ./.github/actions/test-formula
        with:
          formula: ${{ matrix.formula }}
